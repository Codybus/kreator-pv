<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22262e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kreator ofert PV</title>
<style>
:root{--red:#d0202e;--red-d:#a3141f;--ink:#22262e;--ink2:#474d59;--mut:#7c8391;--line:#e2e5ea;--bg:#f3f4f6;--card:#fff;--ok:#1d7f48;--warn:#b26a00;--soft:#fcefef;--chip:#f0f2f5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid #cfd4db;border-radius:7px;padding:7px 9px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(208,32,46,.25);border-color:var(--red)}
input[type=checkbox]{width:auto;accent-color:var(--red);transform:scale(1.15)}
input[type=number]{text-align:right}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.btn{border:1px solid #cfd4db;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn.danger{color:var(--red)}
.topbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;height:58px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand img{height:34px;background:#fff;border-radius:6px;padding:2px 4px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{background:transparent;border:0;color:#c9ced6;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav button.on{color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 -3px 0 var(--red)}
.topbar .sp{flex:1}
.topbar .btn{color:var(--ink)}
main{max-width:1380px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.card h2{margin:0 0 4px;font-size:19px}
.card .sub{color:var(--mut);margin:0 0 18px}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:22px 0 10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.stepper{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.stepper button{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:600;color:var(--ink2)}
.stepper .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:13px;flex:none}
.stepper button.on{border-color:var(--red);color:var(--ink);box-shadow:0 0 0 3px rgba(208,32,46,.1)}
.stepper button.on .n{background:var(--red);color:#fff}
.stepper button.done .n{background:var(--ink);color:#fff}
.side{position:sticky;top:78px}
.side .card{padding:16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mut)}
.kv b{text-align:right}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--red)}
.foot-nav{display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.prod-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pcard{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;text-align:left}
.pcard b{display:block;font-size:16px}
.pcard small{color:var(--mut)}
.pcard.on{border-color:var(--red);background:var(--soft)}
.btn.dots{padding:0 7px;min-height:0;height:20px;font-size:15px;line-height:1;color:#a3a9b3;font-weight:700;letter-spacing:1px}
.btn.dots:hover{color:var(--ink2)}
.info{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink2);margin-top:6px}
.info b{color:var(--ink)}
.counter{display:flex;gap:6px}
.counter input{text-align:center}
.counter .btn{padding:6px 12px}
.result{display:flex;align-items:baseline;gap:8px;background:var(--soft);border-radius:10px;padding:12px 14px}
.result b{font-size:24px;color:var(--red);white-space:nowrap}
.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f3d9a4;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.optlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.opt.on{border-color:var(--red);background:var(--soft)}
.opt .nm{flex:1}
.opt .nm small{display:block;color:var(--mut);font-size:12px}
.opt input[type=number]{width:90px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.tablewrap table.t th{white-space:normal;vertical-align:bottom}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t tr.zero td{color:#a3a9b3}
table.t tr.zero input{color:#a3a9b3}
table.t tr.is-ov{background:#fffaf0}
table.t tr.umowa td{background:#eef7f0}
table.t .rst{visibility:hidden}
table.t tr.is-ov .rst{visibility:visible}
table.t input,table.t select{padding:4px 6px;border-radius:5px}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;padding-top:9px}
.qty{display:flex;align-items:center;gap:4px}
.qty input{width:80px}
.qty span{color:var(--mut);font-size:12px;width:30px}
.w-num{width:110px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.tile span{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.tile b{font-size:18px}
.tile.hl{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile.hl span{color:#b9bfc9}
.pos{color:var(--ok)} .neg{color:var(--red)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.subtabs .cnt{background:var(--chip);border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px}
.tablewrap{overflow:auto;max-height:calc(100vh - 290px);border:1px solid var(--line);border-radius:10px}
.tablewrap table.t td{padding:3px 4px}
.tablewrap table.t input{border-color:transparent;background:transparent}
.tablewrap table.t input:hover{border-color:#cfd4db;background:#fff}
.tablewrap table.t input:focus{background:#fff}
.tablewrap tr:hover td{background:#fafbfc}
.muted{color:var(--mut)}
.small{font-size:12px}
.pill{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.pill.red{background:var(--soft);color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(20,22,28,.45);display:grid;place-items:center;z-index:50}
.modal{background:#fff;border-radius:14px;padding:22px;width:min(760px,94vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}
.switch{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer;margin:0;color:var(--ink)}
.preview-wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.preview-wrap .opts{position:sticky;top:78px}
.preview-area{background:#e4e6ea;border-radius:12px;padding:24px;overflow:auto}
.empty{text-align:center;color:var(--mut);padding:40px}

/* ============ OFERTA (A4) ============ */
.sheet{width:210mm;min-height:296mm;margin:0 auto;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.15);padding:9mm 13mm 7mm;display:flex;flex-direction:column;color:#22262e;font-size:10pt;line-height:1.38;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:3mm;border-bottom:.6mm solid var(--red)}
.sh-head img{height:15mm}
.sh-meta{text-align:right;font-size:8.8pt;color:#5a606b}
.sh-meta .doc{font-size:8pt;letter-spacing:2.5px;font-weight:700;color:var(--red)}
.sh-meta .nr{font-size:12pt;font-weight:700;color:#22262e;margin:1px 0 2px}
.sh-hero{margin-top:4mm;background:#f4f6f9;color:#22262e;border:.3mm solid #e6e9ee;border-radius:3.5mm;padding:5.5mm 7mm;position:relative;overflow:hidden;min-height:34mm;display:flex;align-items:center}
.sh-hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2mm;background:var(--red);z-index:1}
.sh-hero img.hero-img{position:absolute;right:0;top:0;height:100%;width:auto;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28%);mask-image:linear-gradient(to right,transparent 0,#000 28%)}
.sh-hero .txt{position:relative}
.sh-hero .kick{font-size:8.5pt;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:700}
.sh-hero h1{margin:1mm 0 1.2mm;font-size:19pt;line-height:1.15;font-weight:800;letter-spacing:-.3px;color:#22262e}
.sh-hero h1 span{font-weight:400;color:#5a606b;font-size:14pt;white-space:nowrap}
.sh-hero p{margin:0;color:#5a606b;font-size:10pt}
.sh-hero p b{color:#22262e}
.sh-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-top:3.5mm}
.sh-kpi{border:.3mm solid #e3e6eb;border-radius:2.5mm;padding:2.3mm 3mm;display:flex;gap:2.5mm;align-items:center}
.sh-kpi svg{width:8mm;height:8mm;flex:none;color:var(--red)}
.sh-kpi span{display:block;font-size:7.3pt;text-transform:uppercase;letter-spacing:.5px;color:#7c8391;font-weight:600}
.sh-kpi b{font-size:12.5pt;white-space:nowrap}
.sh-h{font-size:8.5pt;text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:var(--red);margin:3.2mm 0 1.3mm;display:flex;align-items:center;gap:2mm}
.sh-h:after{content:"";flex:1;height:.3mm;background:#e3e6eb}
table.spec{width:100%;border-collapse:collapse}
table.spec td{padding:1mm 2mm;border-bottom:.3mm solid #eceef1;vertical-align:top}
table.spec td.k{width:40mm;color:#7c8391;font-weight:600;font-size:9pt}
table.spec td.v b{display:block;font-size:10pt}
table.spec td.v small{color:#7c8391;font-size:8.5pt}
.extras{display:flex;flex-wrap:wrap;gap:1.2mm 2mm}
.extras span{background:#f5f6f8;border-radius:1.5mm;padding:.6mm 2.2mm .6mm 5mm;font-size:8.8pt;font-weight:600;position:relative}
.extras span:before{content:"";position:absolute;left:1.8mm;top:1.6mm;width:1.8mm;height:1mm;border-left:.45mm solid var(--red);border-bottom:.45mm solid var(--red);transform:rotate(-45deg)}
table.spec td.q{text-align:right;white-space:nowrap;font-weight:700;width:22mm}
.sh-two{display:grid;grid-template-columns:1.05fr 1fr;gap:6mm}
ul.scope{list-style:none;margin:0;padding:0;columns:1}
ul.scope li{padding:.6mm 0 .6mm 5.5mm;position:relative;font-size:9.2pt}
ul.scope li:before{content:"";position:absolute;left:0;top:1.7mm;width:3mm;height:1.6mm;border-left:.6mm solid var(--red);border-bottom:.6mm solid var(--red);transform:rotate(-45deg)}
.sh-gw{display:grid;grid-template-columns:repeat(2,1fr);gap:2mm}
.sh-gw div{background:#f5f6f8;border-radius:2.5mm;padding:2mm 2.5mm;display:flex;align-items:center;gap:2.5mm}
.sh-gw b{font-size:15pt;color:var(--red);line-height:1;min-width:11mm;text-align:center}
.sh-gw b small{display:block;font-size:10.5pt;color:var(--red);font-weight:800;margin-top:.6mm;letter-spacing:.2px}
.sh-gw span{font-size:8.2pt;color:#474d59;line-height:1.22}
.sh-price{display:grid;grid-template-columns:1fr 1.15fr;gap:6mm;margin-top:3.5mm;align-items:stretch}
.sh-left{display:flex;flex-direction:column;gap:3mm}
.sh-left .sh-box{flex:1}
.sh-box .valid{font-size:13pt;font-weight:800;color:var(--red)}
.sh-box{border:.3mm solid #e3e6eb;border-radius:3mm;padding:3.5mm 4mm}
.sh-box .lbl{font-size:7.5pt;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;color:#7c8391;margin-bottom:1mm}
.sh-box p{margin:0}
.pricecard{background:linear-gradient(135deg,#d0202e,#a3141f);color:#fff;border-radius:3.5mm;padding:4mm 6mm;display:flex;flex-direction:column;justify-content:center}
.pricecard .lbl{font-size:8pt;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:#ffd0d4}
.pricecard .amt{font-size:27pt;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin:1mm 0}
.pricecard .amt small{font-size:13pt;font-weight:600}
.pricecard .sm{font-size:8.8pt;color:#ffe1e3}
.pricecard .rows{margin-top:3mm;border-top:.3mm solid rgba(255,255,255,.3);padding-top:2.5mm;font-size:9.2pt}
.pricecard .rows div{display:flex;justify-content:space-between;gap:4mm;padding:.5mm 0}
.pricecard .rows .tot{font-weight:800;font-size:12pt;border-top:.3mm solid rgba(255,255,255,.3);margin-top:1mm;padding-top:1.5mm}
.pricecard .rata{margin-top:2.5mm;background:rgba(255,255,255,.14);border-radius:2mm;padding:2mm 3mm;font-size:9pt}
.sh-note{margin-top:4mm;font-size:8.6pt;color:#474d59;background:#f5f6f8;border-radius:2.5mm;padding:2.5mm 3.5mm}
.sh-foot{margin-top:auto;padding-top:4mm}
.sh-foot .in{border-top:.3mm solid #e3e6eb;padding-top:3mm;display:flex;justify-content:space-between;font-size:8pt;color:#7c8391;gap:6mm}
.sh-foot .in b{color:#22262e}
.sh-valid{display:flex;justify-content:space-between;align-items:center;margin-top:4mm;font-size:9pt}
.sh-valid .v{font-weight:700}
.sh-valid .v span{color:var(--red)}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .no-print,.toast,#modal{display:none!important}
  main{padding:0;max-width:none}
  .preview-wrap{display:block}
  .preview-area{background:none;padding:0;border-radius:0;overflow:visible}
  .sheet{box-shadow:none;margin:0;min-height:295mm}
}
@media (max-width:1050px){.layout,.preview-wrap{grid-template-columns:1fr}.side{position:static}.g4{grid-template-columns:repeat(2,1fr)}}
.c-date,.c-only{display:none}
/* follow-up */
.fu-banner{display:flex;gap:6px;align-items:center;background:#fff6e5;border:1px solid #f3d9a4;color:#7a4b00;border-radius:10px;padding:8px 12px;margin-bottom:12px;cursor:pointer;font-size:13.5px}
.fu-banner:hover{border-color:#d9a640}
.fu-switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;margin:0;border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:#fff}
.fu-switch input{margin:0}
.fu-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.fu-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.fu-chip span{background:var(--chip);border-radius:10px;padding:0 6px;margin-left:3px;font-size:11.5px}
.fu-chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.fu-chip.on span{background:rgba(255,255,255,.2)}
.fu-chip.alert:not(.on){border-color:#f0b3b8;color:var(--red)}
.fu-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fu-row{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:#fff}
.fu-row:last-child{border-bottom:0}
.fu-row:hover{background:#fafbfc}
.fu-when{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.fu-when.w-zalegle{color:var(--red)}
.fu-when.w-dzis{color:#c26a00}
.fu-when.w-brak{color:#a3a9b3;font-weight:600}
.fu-when.w-zamknieta{color:var(--ok)}
.fu-name{cursor:pointer;font-size:14.5px}
.fu-name:hover{text-decoration:underline}
.fu-sub{font-size:12px;color:var(--mut);margin-top:1px}
.fu-next{font-size:12.5px;margin-top:2px;color:var(--ink)}
.fu-last{font-size:12px;color:var(--ink2);margin-top:2px;font-style:italic}
.fu-act{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.fu-act a.btn{text-decoration:none}
.fu-dtw{position:relative;display:inline-flex}
.fu-dt{position:absolute;left:0;bottom:0;width:1px !important;height:1px;min-height:0 !important;padding:0 !important;border:0;opacity:0;pointer-events:none}
.fu-when-pill{font-size:11.5px;text-transform:none;letter-spacing:0;margin-left:6px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--ink2)}
.fu-when-pill.w-zalegle{background:var(--soft);color:var(--red)}
.fu-when-pill.w-dzis{background:#fff1dc;color:#c26a00}
.modal.fu-modal{width:min(820px,96vw)}
.modal a.btn{text-decoration:none;color:inherit}
.fu-hist{display:flex;flex-direction:column;gap:8px}
.fu-note{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.fu-note-h{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.fu-note-h .btn{margin-left:auto}
.fu-ust{margin-top:4px;background:#f5f8f5;border-radius:6px;padding:4px 8px}

/* ============ TELEFON ============ */
@media screen and (max-width:760px){
  body{font-size:15px}
  input,select,textarea{font-size:16px;padding:10px 11px;min-height:44px}
  input[type=checkbox]{min-height:0;transform:scale(1.35);margin:4px}
  .btn{padding:10px 14px;min-height:42px}
  .btn.sm{padding:7px 11px;min-height:36px;font-size:13px}
  /* górny pasek: logo + przyciski, pod spodem przewijane menu */
  .topbar{height:auto;flex-wrap:wrap;gap:6px 8px;padding:8px 12px 0}
  .brand{font-size:0;gap:0}
  .brand img{height:32px}
  .topbar .sp{flex:1}
  .nav{order:3;width:100%;margin:2px -12px 0;padding:0 8px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:10px 12px;border-radius:8px 8px 0 0}
  main{padding:12px 10px 110px}
  .card{padding:14px;border-radius:10px}
  .card h2{font-size:18px}
  .card .sub{margin-bottom:12px}
  /* kroki kreatora: kompaktowy pasek */
  .stepper{flex-wrap:nowrap;gap:4px;margin-bottom:12px}
  .stepper button{min-width:0;flex:1;flex-direction:column;gap:3px;padding:7px 4px;font-size:11.5px;text-align:center;line-height:1.15}
  .stepper .n{width:24px;height:24px}
  .toolbar{gap:6px}
  .toolbar > .grow{flex:1 1 100%}
  .toolbar > input,.toolbar > select{max-width:100% !important;flex:1 1 100%}
  /* siatki w jedną kolumnę */
  .grid.g2,.grid.g3,.grid.g4,.grid.g4[style]{grid-template-columns:minmax(0,1fr) !important}
  .grid > *{min-width:0}
  .span2{grid-column:auto}
  .prod-cards{grid-template-columns:1fr;gap:8px}
  .pcard{padding:11px 14px}
  .optlist{grid-template-columns:1fr}
  .opt{padding:11px 12px;min-height:48px}
  .tiles{grid-template-columns:1fr 1fr}
  .result b{font-size:21px}
  .layout .foot-nav{position:sticky;bottom:64px;background:#fff;box-shadow:0 -8px 14px -10px rgba(0,0,0,.18);margin:16px -14px -14px;padding:10px 14px;border-radius:0 0 10px 10px;z-index:5;gap:8px}
  .layout .foot-nav .btn{flex:1;justify-content:center}
  /* podsumowanie ceny – pasek przypięty na dole ekranu */
  .side{position:fixed !important;left:0;right:0;bottom:0;top:auto;z-index:18}
  .side .card{display:flex;align-items:center;gap:14px;padding:8px 14px;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);border-bottom:0}
  .side .sd-price{flex:1;min-width:0}
  .side .sd-lbl{font-size:10px !important}
  .side .big{font-size:23px;line-height:1.1}
  .side .kv{flex-direction:column;align-items:flex-end;gap:0;border:0;padding:0;font-size:12px}
  .side .kv span{font-size:10.5px}
  .side .sd-netto{display:none}
  /* tabele: domyślnie przewijane w poziomie */
  table.t{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tablewrap{max-height:none}
  /* tabele-karty (lista ofert, koszty ręczne) */
  table.cards,table.cards tbody{display:block;overflow:visible}
  table.cards thead{display:none}
  table.cards tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  table.cards tr.umowa{background:#eef7f0}
  table.cards tr.umowa td{background:transparent}
  table.cards td{border:0;padding:0;text-align:left !important;white-space:normal !important}
  table.cards td[data-l]:before{content:attr(data-l);display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:1px}
  table.cards .c-full,table.cards .c-head{grid-column:1 / -1}
  table.cards .c-head{font-size:15px}
  table.cards .c-klient{font-size:16px}
  table.cards .c-hide{display:none}
  .c-date,.c-only{display:inline}
  .c-um{display:flex;align-items:center;gap:4px;margin:0;font-weight:600;color:var(--ink)}
  table.cards .c-act{display:flex;gap:8px;justify-content:flex-start}
  table.cards .c-act .btn:first-child{flex:1;justify-content:center}
  table.cards.cu tr{grid-template-columns:1fr auto auto}
  table.cards.cu .c-act{grid-column:auto;align-self:end}
  table.cards.cu .w-num{margin-left:0 !important;width:100%}
  /* podgląd oferty: arkusz A4 skalowany do szerokości telefonu (skrypt) */
  .preview-wrap .opts{position:static}
  .preview-area{padding:8px;border-radius:10px;overflow:hidden}
  .sheet{box-shadow:0 4px 18px rgba(0,0,0,.15)}
  .modal{padding:16px;width:96vw;border-radius:12px}
  .toast{bottom:96px;width:max-content;max-width:92vw;text-align:center}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .subtabs button{white-space:nowrap;padding:10px 11px}
  details.info summary{padding:4px 0}
  .fu-row{grid-template-columns:1fr;gap:4px;padding:11px 12px}
  .fu-act{justify-content:flex-start;margin-top:4px}
  .fu-act .btn{min-height:38px;min-width:42px;justify-content:center}
}
</style>

    fr.onload = () => { const im = new Image(); im.onerror = () => rej(new Error("nieobsługiwany format")); im.onload = () => {

async function fuNotify(title, body) {

}
function fuTick() {
  try {
    if ("Notification" in window && Notification.permission === "granted" && localStorage.getItem("kreatorPV.fuNotif") === "1") {
      const now = Date.now(); let sent = {}; try { sent = JSON.parse(localStorage.getItem("kreatorPV.fuSent") || "{}"); } catch (e) { }
      store.offers.filter(fuActive).forEach(o => {
        const f = fuOf(o); if (!f.nastepny) return;
        const t = new Date(f.nastepny).getTime(), key = o.id + "|" + f.nastepny;
        if (t <= now && t > now - 12 * 3600e3 && !sent[key]) { sent[key] = 1; fuNotify("Kontakt: " + (o.klient.nazwa || o.nr), [f.nastepnyCo, o.klient.telefon].filter(Boolean).join(" · ") || o.nr); }
      });
      localStorage.setItem("kreatorPV.fuSent", JSON.stringify(sent));
    }
    const b = fuBadge(); if (fuTick.last !== undefined && b !== fuTick.last && !document.querySelector("#modal .modal")) renderSafe(); fuTick.last = b;
  } catch (e) { }
}

function csvDo() {

    if (li === 0 && cols.some(c => c[1].toLowerCase() === (cells[0] || "").toLowerCase() || cells[0].toLowerCase() === "nazwa")) return;
    if (!cells[0]) return;

    else { store.db[cat].push({ id: uid(), akt: todayISO(), ...obj }); add++; }

function nrSeq(nr) { const m = String(nr || "").match(/(\d+)\s*$/); return m ? parseInt(m[1], 10) : 0; }
let savingOffer = false;

function resetSheet(sh) { sh.style.zoom = ""; sh.style.width = ""; sh.style.minHeight = ""; }
function fitSheet() {
  const sh = document.querySelector(".sheet"); if (!sh) return;
  resetSheet(sh);
  const mm = sh.getBoundingClientRect().width / 210, maxH = 293 * mm;
  sh.style.minHeight = "0";
  if (sh.scrollHeight <= maxH) { sh.style.minHeight = ""; return; }
  /* największa skala z, przy której arkusz ułożony na szerokość 210/z mm mieści się na stronie;
     po pomniejszeniu ×z ma znów dokładnie 210 mm szerokości */
  const fits = z => { sh.style.width = (210 / z) + "mm"; return sh.scrollHeight * z <= maxH; };
  let lo = 0.3, hi = 1;
  for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
  const z = Math.floor(lo * 1000) / 1000;
  sh.style.width = (210 / z) + "mm";
  sh.style.minHeight = (295 / z) + "mm";
  sh.style.zoom = String(z);
}
let titleBak = null;
window.addEventListener("beforeprint", () => { fitSheet(); if (document.querySelector(".sheet")) { titleBak = document.title; document.title = offerLabel(O); } });
/* telefon: podgląd arkusza A4 dopasowany do szerokości ekranu */
function fitPreview() {
  const sh = document.querySelector(".preview-area .sheet"); if (!sh || titleBak !== null) return;
  sh.style.zoom = "";
  const area = sh.parentElement, w = area.clientWidth - 16, sw = sh.offsetWidth;
  if (window.innerWidth <= 760 && sw > w) sh.style.zoom = String(Math.floor(w / sw * 1000) / 1000);
}
window.addEventListener("resize", () => { clearTimeout(window.__fp); window.__fp = setTimeout(fitPreview, 120); });
window.addEventListener("afterprint", () => { setTimeout(fitPreview, 50); });
window.addEventListener("afterprint", () => { const sh = document.querySelector(".sheet"); if (sh) resetSheet(sh); if (titleBak !== null) { document.title = titleBak; titleBak = null; } });
